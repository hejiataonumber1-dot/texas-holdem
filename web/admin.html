<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好友牌局 · 管理员</title><link rel="stylesheet" href="/style.css?v=web16"></head><body><main class="admin-page"><header><a class="brand" href="/">♠ 好友牌局</a><span class="connection">管理员</span></header><section id="admin-login" class="panel admin-panel"><div class="eyebrow">ADMIN ACCESS</div><h1>管理你的牌桌。</h1><p>登录后可以设置创建房间的授权码。加入房间不需要授权码。</p><form id="login-form"><label for="admin-username">管理员账号</label><input id="admin-username" autocomplete="username" required maxlength="64"><label for="admin-password">管理员密码</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="128"><button class="primary entry-action">登录管理后台</button></form></section><section id="admin-console" class="panel admin-panel" hidden><div class="summary-heading"><div><div class="eyebrow">ROOM ACCESS</div><h2>创建授权码</h2></div><button id="admin-logout" class="quiet small">退出登录</button></div><p>默认允许自由创建房间；需要限制时，开启下方开关并保存。加入房间无需创建授权码。</p><form id="policy-form"><label class="switch-row" for="require-code"><span><b>创建房间需要授权码</b><small>默认关闭；主动开启后才要求授权码，房间密码仍有效</small></span><input id="require-code" type="checkbox"></label><button class="primary entry-action">保存创建方式</button></form><p id="policy-status"></p><div id="code-status" class="watchers"></div><form id="code-form"><label for="authorization-code">新授权码</label><input id="authorization-code" type="password" minlength="8" maxlength="32" placeholder="输入 8～32 个字符，留空自动生成" autocomplete="new-password"><label for="code-days">有效期（天）</label><input id="code-days" type="number" min="1" max="365" value="7" required><label for="code-uses">允许创建房间总次数</label><input id="code-uses" type="number" min="1" max="1000" value="20" required><p class="muted">保存新码会立即使旧码失效；已创建的房间继续正常使用。</p><button class="primary entry-action">设置新授权码</button></form><section id="issued-code" class="issued-code" hidden><label for="new-code-output">刚设置的授权码</label><input id="new-code-output" readonly aria-label="刚设置的授权码"><p>请复制保存，再发给允许建房的朋友。刷新后不会再次显示完整授权码。</p><button id="copy-code" class="secondary">复制授权码</button></section><div class="dialog-actions"><button id="code-refresh" class="secondary">刷新状态</button><button id="code-disable" class="quiet">停用当前授权码</button></div></section><p id="admin-message" role="status"></p></main><script src="/admin.js?v=web16"></script></body></html>
